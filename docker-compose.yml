services:
  db:
    container_name: db
    restart: always
    image: postgres:15
    volumes:
      - db-data:/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    env_file:
      - .env
    networks:
      - base_network
  web:
    container_name: fastapi
    build:
      context: .
      args:
        INSTALL_DEV: ${INSTALL_DEV-true}
    volumes:
      - .:/app
      - file-db-data:/app/data
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - base_network
volumes:
  db-data:
  file-db-data:


networks:
  base_network:
    driver: bridge
